<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pierre, papier, ciseaux</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #20233b;
            background: #f3f5ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 16px;
            background:
                radial-gradient(ellipse at 10% 12%, #dfe4ff 0, transparent 34%),
                radial-gradient(ellipse at 90% 88%, #ffe9dc 0, transparent 32%),
                #f7f8fc;
        }

        main {
            width: min(100%, 680px);
            padding: clamp(24px, 6vw, 52px);
            border: 1px solid #ffffff;
            border-radius: 30px;
            background: rgb(255 255 255 / 90%);
            box-shadow: 0 24px 70px rgb(46 51 98 / 12%);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #6d68d8;
            font-size: 0.76rem;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.25rem);
            letter-spacing: -0.06em;
            line-height: 1.05;
        }

        .intro {
            margin: 14px 0 30px;
            color: #777b91;
            font-size: 1rem;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .choice {
            min-width: 0;
            padding: 18px 10px 16px;
            border: 1px solid #e8e9f4;
            border-radius: 22px;
            background: #fbfbff;
            color: #30334b;
            font: inherit;
            font-weight: 750;
            cursor: pointer;
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        .choice:hover:not(:disabled) {
            transform: translateY(-5px);
            border-color: #b7b4ff;
            box-shadow: 0 12px 24px rgb(83 78 175 / 12%);
        }

        .choice:focus-visible {
            outline: 3px solid #7770e8;
            outline-offset: 3px;
        }

        .choice:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .illustration {
            width: 78px;
            height: 78px;
            display: grid;
            place-items: center;
            margin: 0 auto 10px;
            border-radius: 20px;
        }

        .rock .illustration {
            background: #edf0f7;
        }

        .paper .illustration {
            background: #fff3d9;
        }

        .scissors .illustration {
            background: #ffe9e8;
        }

        .illustration svg {
            width: 58px;
            height: 58px;
        }

        .score {
            display: inline-flex;
            gap: 10px;
            align-items: center;
            margin: 26px 0 0;
            padding: 11px 18px;
            border-radius: 999px;
            background: #f0efff;
            color: #514bb1;
            font-size: 0.95rem;
            font-weight: 750;
        }

        .score-label {
            color: #7d7aab;
            font-weight: 600;
        }

        .status {
            min-height: 52px;
            margin: 24px 0 0;
            color: #555a70;
            font-size: 1rem;
            line-height: 1.6;
        }

        .result {
            margin: 8px 0 0;
            color: #514bb1;
            font-size: 1.2rem;
        }

        @media (max-width: 440px) {
            .choices {
                gap: 8px;
            }

            .choice {
                padding: 12px 6px;
                border-radius: 17px;
                font-size: 0.9rem;
            }

            .illustration {
                width: 64px;
                height: 64px;
                border-radius: 16px;
            }

            .illustration svg {
                width: 50px;
                height: 50px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Une partie en 5 manches</p>
        <h1>Pierre, papier, ciseaux</h1>
        <p class="intro">Choisissez votre coup pour défier l’ordinateur.</p>
        <div class="choices" aria-label="Choisissez votre coup">
            <button class="choice rock" type="button" data-choice="pierre">
                <span class="illustration">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <path d="M12 43 17 26l12-10 15 3 10 13-4 17-17 5-15-3Z" fill="#9299ad"/>
                        <path d="m17 26 12-10 15 3-7 12-14 3Z" fill="#c6cad5"/>
                        <path d="m23 34 14-3 13 14-17 5-15-3Z" fill="#747c92"/>
                        <path d="m29 16 6 8-7 10" fill="none" stroke="#e1e3ea" stroke-linecap="round" stroke-width="2"/>
                    </svg>
                </span>
                Pierre
            </button>
            <button class="choice paper" type="button" data-choice="papier">
                <span class="illustration">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <path d="M20 10h18l12 12v31H20a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4Z" fill="#fff" stroke="#e3b94e" stroke-width="3"/>
                        <path d="M38 10v13h12" fill="#ffe9a8" stroke="#e3b94e" stroke-linejoin="round" stroke-width="3"/>
                        <path d="M24 33h19M24 40h19M24 47h13" stroke="#e3b94e" stroke-linecap="round" stroke-width="3"/>
                    </svg>
                </span>
                Papier
            </button>
            <button class="choice scissors" type="button" data-choice="ciseaux">
                <span class="illustration">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <circle cx="18" cy="43" r="7" fill="none" stroke="#e27170" stroke-width="4"/>
                        <circle cx="21" cy="22" r="7" fill="none" stroke="#e27170" stroke-width="4"/>
                        <path d="m25 26 26 25M24 39l27-23" fill="none" stroke="#717990" stroke-linecap="round" stroke-width="4"/>
                        <circle cx="32" cy="32" r="3" fill="#717990"/>
                    </svg>
                </span>
                Ciseaux
            </button>
        </div>
        <p id="score" class="score"><span>Vous : 0</span><span class="score-label">—</span><span>Ordinateur : 0</span></p>
        <p id="status" class="status" aria-live="polite">Choisissez pierre, papier ou ciseaux pour jouer.</p>
        <h2 id="result" class="result" aria-live="polite"></h2>
        <a href="/doc/index-console.html">jouer en utilisant la console</a>.
    </main>
    <script src="script.js"></script>
</body>
</html>
